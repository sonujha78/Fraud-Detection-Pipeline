plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.frauddetection'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.kafka:kafka-streams:3.8.0'
    implementation 'org.apache.kafka:kafka-clients:3.8.0'

    implementation 'com.datastax.oss:java-driver-core:4.17.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.slf4j:slf4j-simple:2.0.13'

    testImplementation 'org.apache.kafka:kafka-streams-test-utils:3.8.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

application {
    mainClass = 'com.frauddetection.streams.FraudDetectionApp'
}

test {
    useJUnitPlatform()
}

tasks.named('distZip') { dependsOn tasks.named('shadowJar') }
tasks.named('distTar') { dependsOn tasks.named('shadowJar') }
tasks.named('startScripts') { dependsOn tasks.named('shadowJar') }

shadowJar {
    archiveBaseName.set('fraud-detection-streams')
    archiveClassifier.set('all')
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
